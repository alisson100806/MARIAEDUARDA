<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maria Eduarda</title>
  <meta name="description" content="Maria Eduarda" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 36px;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }
    main {
      width: min(100%, 440px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }
    video {
      width: 100%;
      max-height: 78vh;
      background: #111;
      border-radius: 18px;
    }
    p {
      font-size: clamp(16px, 3.4vw, 28px);
      line-height: 1.45;
      letter-spacing: 0.04em;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main>
    <video controls playsinline preload="metadata">
      <source src="videos/salmao-flambado.mp4?v=2" type="video/mp4" />
    </video>
    <p>(INFELIZMENTE VOCE NÃO QUIS CONTINUAR NOSSA HISTORIA)</p>
  </main>
</body>
</html>
